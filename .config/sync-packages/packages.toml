[pacman]
packages = [
    # Base system
    "base",
    "base-devel",
    "efibootmgr",

    # Kernel & firmware
    "linux",
    "linux-lts",
    "linux-firmware-intel",
    "intel-ucode",
    "sof-firmware", # Sound Open Firmware for modern Intel audio codecs

    # Intel GPU / graphics drivers
    "intel-media-driver",
    "libva-intel-driver",
    "libva-utils",
    "libvdpau-va-gl", # VDPAU-to-VA-API bridge
    "vdpauinfo",
    "vpl-gpu-rt", # Intel oneVPL runtime for hardware video encode/decode
    "vulkan-intel",
    "vulkan-tools",

    # Firmware / hardware management
    "fwupd", # firmware updates via LVFS
    "smartmontools", # SMART disk health monitoring
    "usbutils",
    "android-udev", # udev rules for Android devices (adb/mtp)

    # Filesystems & storage
    "fuse2", # FUSE v2 (required by some AppImages / legacy apps)
    "udisks2", # disk mount daemon
    "gptfdisk", # gdisk / sgdisk partitioning
    "xfsprogs", # XFS tools (used for /xfs/containerd)
    "zram-generator", # systemd generator for swap-on-zram

    # Power & thermal
    "power-profiles-daemon",

    # Shell essentials
    "bash-completion",
    "less",
    "man-db",
    "openssh",
    "rsync",
    "wget",

    # CLI utilities
    "atool", # unified archive wrapper (aunpack, apack)
    "pigz", # parallel gzip
    "unzip",
    "lsof",
    "strace",
    "tinyxxd", # small xxd hex-dumper
    "qrencode",

    # Network diagnostics
    "bind", # dig, nslookup
    "dog", # modern dig replacement
    "gnu-netcat",
    "inetutils",
    "net-tools",
    "socat", # multipurpose network relay
    "sshpass", # non-interactive ssh password
    "x11-ssh-askpass", # graphical ssh passphrase prompt

    # Sway / Wayland compositor
    "sway",
    "swaybg",
    "swayidle",
    "waybar",
    "rofi",
    "mako", # notification daemon
    "grim", # screenshot capture
    "slurp", # region selector (used with grim)
    "wdisplays", # GUI display arrangement
    "wev", # wayland event viewer (keycodes)
    "wl-mirror", # mirror any wayland output
    "qt6-wayland",
    "xorg-xwayland",

    # Desktop integration
    "xdg-desktop-portal-gtk",
    "xdg-desktop-portal-wlr",
    "xdg-user-dirs",
    "xdg-utils",
    "dex", # runs XDG autostart .desktop entries
    "polkit-gnome", # polkit authentication agent
    "libnotify",

    # Input & display control
    "brightnessctl",
    "ydotool", # wayland-compatible xdotool replacement
    "gammastep", # night-light / color temperature
    "geoclue", # geolocation service (feeds gammastep)

    # Bluetooth
    "bluez",
    "bluez-utils",
    "blueman",

    # Wireless / networking
    "iwd", # iNet wireless daemon (WiFi)
    "wireless_tools",
    "iptables",
    "systemd-resolvconf",

    # Audio (PipeWire stack)
    "pipewire",
    "pipewire-alsa",
    "pipewire-jack",
    "pipewire-libcamera",
    "pipewire-pulse",
    "wireplumber", # pipewire session manager
    "gst-plugin-pipewire",
    "alsa-plugins",
    "libpulse",
    "pavucontrol",
    "speech-dispatcher",

    # Media playback & editing
    "mpv",
    "obs-studio",
    "kdenlive",

    # Image / document processing
    "imagemagick",
    "imlib2", # image loading lib (yazi previews)
    "poppler", # PDF rendering (yazi previews)
    "ffmpegthumbnailer", # video thumbnail generation
    "resvg", # SVG renderer (yazi previews)

    # Terminal & TUI
    "kitty",
    "yazi", # file manager
    "htop",
    "bat", # cat with syntax highlighting
    "dust", # du replacement
    "fastfetch", # system info banner
    "glow", # markdown renderer
    "zoxide", # smart cd

    # Editor
    "neovim",
    "tree-sitter-cli",
    "shfmt", # shell script formatter

    # Git / VCS
    "git",
    "git-filter-repo", # history rewriting
    "github-cli",

    # Fonts
    "adobe-source-han-sans-otc-fonts",
    "noto-fonts",
    "noto-fonts-emoji",
    "otf-font-awesome",
    "woff2-font-awesome",
    "ttf-dejavu",

    # Browsers
    "firefox",
    "firefoxpwa", # Firefox PWA support (PWAsForFirefox)
    "chromium",

    # Development: build tooling
    "cmake",
    "extra-cmake-modules", # KDE CMake modules

    # Development: languages / runtimes
    "rustup",
    "bun",
    "uv", # python package/project manager

    # Development: Python extras
    "tk", # Tcl/Tk (matplotlib Tk backend, turtle, etc.)

    # Development: language servers
    "typescript-language-server",

    # Containers & Kubernetes
    "docker",
    "docker-buildx",
    "docker-compose",
    "dive", # inspect docker image layers
    "crictl", # CRI (kubelet runtime) CLI
    "critest", # CRI conformance tests
    "kubeadm",
    "kubectl",
    "minikube",
    "helm",
    "cilium-cli", # Cilium eBPF networking for k8s

    # Infrastructure as code
    "opentofu", # open-source Terraform fork

    # Cloud / PKI
    "aws-vault", # secure AWS credential storage
    "cfssl", # CloudFlare SSL/PKI toolkit

    # Databases
    "postgresql",
    "mariadb-clients", # mysql/mariadb client utilities

    # IPFS
    "kubo", # go-ipfs daemon

    # Dev CLI misc
    "act", # run GitHub Actions locally
    "lazydocker", # docker TUI
    "yq", # jq for YAML/XML

    # Security: auth & secrets
    "gnome-keyring",
    "python-keyring",
    "keychain", # ssh/gpg-agent frontend
    "libfido2", # FIDO2/WebAuthn (YubiKey etc.)
    "fprintd", # fingerprint reader daemon

    # Security: tooling
    "firejail", # sandboxing
    "lynis", # security auditing

    # Desktop applications
    "anki",
    "code", # VS Code OSS
    "gimp",
    "loupe", # GNOME image viewer
    "caja", # MATE file manager
    "gparted",
    "bitwarden-cli",

    # PDF / documents
    "zathura",
    "zathura-pdf-mupdf",

    # Printing
    "cups",
    "cups-pdf",
    "gutenprint", # printer driver collection
    "hplip", # HP printer/scanner drivers

    # System maintenance
    "etckeeper", # /etc version control
    "pacman-contrib", # paccache, checkupdates, etc.
    "reflector", # mirrorlist optimizer
    "flatpak",
    "geoipupdate", # MaxMind GeoIP DB updater
]

[aur]
packages = [
    # Sway extras
    "sway-overfocus", # directional/tab window cycling
    "sway-scratch", # scratchpad helper
    "sway-win-extra", # extra window manipulation ops
    "swayipc-cpp", # sway IPC C++ library
    "swaylock-effects",
    "swaylock-corrupter", # glitch-art lockscreen effect

    # Editor
    "neovim-symlinks", # vi/vim -> nvim symlinks

    # Theming
    "arc-gtk-theme",
    "arc-icon-theme",

    # Package management
    "yay", # AUR helper
    "yaycache", # yay build cache manager
    "downgrade", # roll back pacman packages

    # Browsers
    "brave-bin",

    # Messaging / communication
    "beeper-v4-bin", # unified chat client
    "signal-cli", # Signal messenger CLI

    # Productivity / notes
    "notion-app-electron",
    "insync", # Google Drive sync client

    # Claude / AI
    "claude-code",
    "claude-cowork-service",
    "claude-desktop-bin",

    # VPN
    "mullvad-vpn-bin",

    # GraphQL
    "nitro-bin",
    "nitro-beta-bin",

    # Cloud / dev CLIs
    "google-cloud-cli",
    "bws-bin", # Bitwarden Secrets Manager CLI

    # Linters / formatters
    "hadolint-bin", # Dockerfile linter
    "shellcheck-bin", # shell script linter

    # TeX
    "texlive-installer",

    # Terminal / CLI utilities
    "pspg", # pager for psql/SQL result sets
    "rich-cli", # Rich (Python) markdown/code renderer
    "tdf", # terminal PDF viewer
    "voxd", # voice-to-text daemon

    # Firefox
    "firefox-user-autoconfig", # enable user.js autoconfig support

    # System maintenance
    "topgrade", # unified upgrade runner (pacman, yay, flatpak, etc.)

    # System / boot
    "ventoy-bin", # multiboot USB creator

    # Input
    "libinput-gestures", # touchpad gesture daemon

    # Python libs
    "python-sounddevice", # PortAudio bindings (used by voxd)
]

[bun]
packages = [
    "@google/clasp", # Google Apps Script CLI
    "@googleworkspace/cli",
    "serverless", # Serverless Framework
    "wrangler", # Cloudflare Workers CLI
]

[flatpak]
packages = [
    "com.spotify.Client",
    "com.slack.Slack",
    "com.getpostman.Postman",
    "org.signal.Signal",
    "org.deluge_torrent.deluge",
]
